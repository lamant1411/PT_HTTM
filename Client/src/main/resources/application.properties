# Cấu hình server (cổng 8080)
server.port=8080

# Cấu hình CSDL MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/pt_httm?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=khoi21102004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JPA/Hibernate - TẮT auto DDL vì dùng JDBC thuần
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Spring JDBC - Tự động chạy schema.sql khi khởi động
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.platform=mysql

# Cấu hình upload file
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
# Sử dụng thư mục tạm và cho phép cleanup delay để tránh lỗi trên Windows
spring.servlet.multipart.location=${java.io.tmpdir}

# --- PYTHON SCRIPT CONFIGURATION ---
# Python executable (mặc định là 'python', có thể dùng 'python3' hoặc đường dẫn đầy đủ)
python.executable=python

# Đường dẫn TUYỆT ĐỐI đến script Python
